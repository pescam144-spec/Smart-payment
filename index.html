<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Pocket Budget</title>

    <!-- Font (needs internet; the app still works without it) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Design: connects to style.css (must be in the same folder) -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- The app screens are drawn into this box by script.js -->
    <div id="app"></div>

    <!-- Dark background behind the add-spending popup -->
    <div class="back" id="back"></div>

    <!-- Add / edit spending popup -->
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Add spending"></div>

    <!-- Small message shown at the bottom -->
    <div class="toast" id="toast" role="status"></div>

    <!-- Logic: connects to script.js (must be in the same folder) -->
    <script src="script.js"></script>
  </body>
</html>
